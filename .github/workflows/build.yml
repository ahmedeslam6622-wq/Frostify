name: Build Frostify APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to produce"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (release)
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build APK (debug)
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: locate
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frostify-${{ inputs.build_type }}-${{ github.run_number }}
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
